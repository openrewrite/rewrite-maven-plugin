---
name: ci

on:
  push:
    branches:
      - main
    tags-ignore:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: 0 17 * * *

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.gradle_enterprise_cache_username }}
  GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.gradle_enterprise_cache_password }}
  DEVELOCITY_ACCESS_KEY: ${{ secrets.gradle_enterprise_access_key }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: codegenome
          server-username: CODEGENOME_USERNAME
          server-password: CODEGENOME_TOKEN
          gpg-private-key: ${{ secrets.OSSRH_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: validate-develocity-access-key
        run: |
          if [ -n "$DEVELOCITY_ACCESS_KEY" ] && ! echo "$DEVELOCITY_ACCESS_KEY" | grep -q '='; then
            echo "DEVELOCITY_ACCESS_KEY is malformed (missing server-host= prefix), unsetting"
            echo "DEVELOCITY_ACCESS_KEY=" >> $GITHUB_ENV
          fi
      - name: build
        run: ./mvnw --show-version --update-snapshots clean verify --file=pom.xml --fail-at-end --batch-mode -Dstyle.color=always
        env:
          # Activates the codegenome profile in pom.xml; empty on pull requests from forks, which
          # receive no secrets, leaving the profile inactive.
          CODEGENOME_USERNAME: ${{ secrets.CODEGENOME_USERNAME }}
          CODEGENOME_TOKEN: ${{ secrets.CODEGENOME_TOKEN }}
      - name: publish-snapshots
        if: github.event_name != 'pull_request'
        run: ./mvnw --show-version --file=pom.xml --batch-mode -Dstyle.color=always --activate-profiles=sign-artifacts clean deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEGENOME_USERNAME: ${{ secrets.CODEGENOME_USERNAME }}
          CODEGENOME_TOKEN: ${{ secrets.CODEGENOME_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_SIGNING_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CGP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CGP_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
      - name: slack-notification
        if: failure() && github.event_name == 'schedule' && (github.repository_owner == 'openrewrite' || github.repository_owner == 'moderneinc')
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.OPS_GITHUB_ACTIONS_WEBHOOK }}
          MSG_MINIMAL: true
          SLACK_MESSAGE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_USERNAME: ${{ github.repository }} CI failure
          SLACK_COLOR: failure
          SLACK_FOOTER: ''
